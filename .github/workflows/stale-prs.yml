name: Close Stale Pull Requests

on:
  schedule:
    - cron: '0 12 * * *' # Run every day at 12:00pm

jobs:
  close_stale_prs:
    runs-on: ubuntu-latest
    steps:
      - name: Close stale pull requests
        uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9
        with:
          stale-issue-message: 'This pull request has been automatically closed because it has been inactive for more than 30 days. Please reopen if you still intend to submit this pull request.'
          days-before-stale: 14
          days-before-close: 30
          stale-pr-message: 'This pull request has been marked as stale because it has been inactive for more than 14 days. If you want to prevent this pull request to be closed in the next 16 days, please add the label `do-not-close`'
          stale-pr-label: stale
          exempt-draft-pr: true
          exempt-pr-labels: do-not-close,dependencies
